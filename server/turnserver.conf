# Duet App - Coturn TURN Server Configuration
# Deploy on a server with public IP and open ports 3478, 5349, 49152-65535

# =====================
# NETWORK SETTINGS
# =====================

# TURN listener port (UDP and TCP)
listening-port=3478

# TLS listener port
tls-listening-port=5349

# Public IP of your server (REQUIRED - replace with your server's public IP)
# You can also use external-ip=auto if running with DETECT_EXTERNAL_IP=yes
external-ip=YOUR_SERVER_PUBLIC_IP

# Relay IP range for media
min-port=49152
max-port=65535

# =====================
# AUTHENTICATION
# =====================

# Realm (use your domain)
realm=turn.yourdomain.com

# Time-limited credentials (TURN REST API). The getTurnCredentials Cloud
# Function mints per-user credentials signed with this shared secret; they
# expire after 24 hours. Use the SAME value as the Firebase secret
# TURN_SHARED_SECRET. Generate one with: openssl rand -hex 32
# Never commit the real value.
use-auth-secret
static-auth-secret=REPLACE_WITH_TURN_SHARED_SECRET

# Do not add a static "user=" account: a single shared password ends up in
# every app build and in the public web bundle.

# =====================
# SECURITY
# =====================

# Fingerprint for STUN messages
fingerprint

# Disable anonymous/insecure options
no-multicast-peers
no-loopback-peers

# Never relay to private, loopback, link-local (incl. the cloud metadata
# service at 169.254.169.254) or other special-purpose ranges, so relay
# credentials can't be used to reach the server's own network.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
no-cli
no-tlsv1
no-tlsv1_1

# Rate limiting
max-bps=1000000
total-quota=100
stale-nonce=600

# =====================
# TLS/SSL (Recommended for production)
# =====================

# Uncomment and configure for TLS support
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

# =====================
# LOGGING
# =====================

# Log to stdout (for Docker)
log-file=stdout

# Verbose logging (disable in production)
# verbose

# =====================
# PERFORMANCE
# =====================

# Number of relay threads (adjust based on server CPU)
relay-threads=4

# Note: do NOT set no-udp-relay. Despite older comments here, it disables
# UDP relaying entirely, and WebRTC clients request UDP relays.

# Disable TCP relay (most clients use UDP)
# no-tcp-relay

# =====================
# OPTIONAL: Redis for multi-server
# =====================

# redis-userdb="ip=127.0.0.1 dbname=0 password=YOUR_REDIS_PASSWORD"
