name: Build & Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  # =====================
  # TYPE CHECK
  # =====================
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install app dependencies
        run: npm ci

      - name: Type check app
        run: npx tsc --noEmit

      - name: Install function dependencies
        working-directory: firebase/functions
        run: npm ci

      - name: Type check cloud functions
        working-directory: firebase/functions
        run: npx tsc --noEmit

  # =====================
  # BUILD ANDROID (Preview)
  # =====================
  build-android-preview:
    name: Build Android (Preview)
    needs: typecheck
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Android Preview
        run: eas build --platform android --profile preview --non-interactive

  # =====================
  # BUILD iOS (Preview)
  # =====================
  build-ios-preview:
    name: Build iOS (Preview)
    needs: typecheck
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build iOS Preview
        run: eas build --platform ios --profile preview --non-interactive

  # =====================
  # BUILD & SUBMIT (Production)
  # =====================
  build-production:
    name: Build Production
    needs: typecheck
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        platform: [android, ios]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.platform }}
        run: eas build --platform ${{ matrix.platform }} --profile production --non-interactive

  # =====================
  # SUBMIT TO STORES
  # =====================
  submit-stores:
    name: Submit to Stores
    needs: build-production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # eas submit evaluates app.config.js, whose config plugins must resolve
      - name: Install dependencies
        run: npm ci

      # Store credentials come from EAS (expo.dev → project → Credentials):
      # an App Store Connect API key for iOS and a Google service account key
      # for Android. Each platform is submitted even if the other fails.
      - name: Submit to App Store
        id: submit_ios
        continue-on-error: true
        run: |
          # Newest finished production build (not a PR preview build)
          BUILD_ID=$(eas build:list --platform ios --build-profile production --status finished --limit 1 --json --non-interactive | jq -r '.[0].id')
          echo "Submitting ios build $BUILD_ID"
          eas submit --platform ios --id "$BUILD_ID" --non-interactive

      - name: Submit to Google Play
        id: submit_android
        continue-on-error: true
        run: |
          # Newest finished production build (not a PR preview build)
          BUILD_ID=$(eas build:list --platform android --build-profile production --status finished --limit 1 --json --non-interactive | jq -r '.[0].id')
          echo "Submitting android build $BUILD_ID"
          eas submit --platform android --id "$BUILD_ID" --non-interactive

      - name: Report submission result
        run: |
          echo "App Store: ${{ steps.submit_ios.outcome }} · Google Play: ${{ steps.submit_android.outcome }}"
          if [ "${{ steps.submit_ios.outcome }}" != "success" ] || [ "${{ steps.submit_android.outcome }}" != "success" ]; then
            echo "::error::A store submission failed; see the step logs above. The builds are on EAS and can be submitted with 'npx eas-cli submit --platform <ios|android> --latest'."
            exit 1
          fi
